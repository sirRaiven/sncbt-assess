# Merge these values into the CURRENT supabase/config.toml.
# Do not replace the entire config file with this snippet.

[auth]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"
enable_anonymous_sign_ins = false
enable_manual_linking = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"

# Keep auth-sign-in public at the platform JWT layer because it is the endpoint
# that obtains the user's JWT. Authentication is performed inside the function.
[functions.auth-sign-in]
enabled = true
verify_jwt = false
entrypoint = "./functions/auth-sign-in/index.ts"
